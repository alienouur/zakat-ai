# نسخة التشغيل الذاتي (On-Premises) لصندوق الزكاة — تُشغَّل بأمر واحد: docker compose up -d
services:
  zakat-ai:
    build:
      context: ..
      dockerfile: Dockerfile
    image: zakat-ai:latest
    container_name: zakat-ai
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      ZAKAT_DATA_DIR: /data
    volumes:
      - zakat_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  zakat_data:
    name: zakat_data
