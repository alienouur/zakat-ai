# fly.toml app configuration file generated for zakat-ai on 2026-09-28T07:00:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zakat-ai'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  GEMINI_MODEL = 'gemini-3.8-flash'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
