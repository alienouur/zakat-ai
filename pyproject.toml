[tool.poetry]
name = "zakat-ai"
version = "0.1.0"
description = "Source-backed, multi-methodology zakat fiqh assistant (Albani, Ibn Uthaymeen, Ibn Baz, Maliki, comparative)"
authors = ["alienouur <alienouur@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = { version = ">=0.115,<1", extras = ["standard"] }
uvicorn = { version = ">=0.30,<1", extras = ["standard"] }
pydantic = ">=2.7,<3"
rank-bm25 = ">=0.2.2,<0.3"
httpx = ">=0.27,<1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
