[project]
name = "zakat-ai"
version = "0.1.0"
description = "Source-backed, multi-methodology zakat fiqh assistant (Albani, Ibn Uthaymeen, Ibn Baz, Maliki, comparative)"
authors = [{ name = "alienouur", email = "alienouur@gmail.com" }]
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "rank-bm25>=0.2.2,<0.3",
    "httpx>=0.27,<1",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
